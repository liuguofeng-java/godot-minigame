name: Build WeChat Godot engine

on:
  workflow_dispatch:
    inputs:
      enable_3d:
        description: Include 3D engine features
        type: boolean
        default: false
  push:
    paths: ['build.py', 'addons/**', 'wechat/**', 'engine/**', 'tools/**', 'tests/**', 'examples/**', '.github/workflows/main.yml']
  pull_request:

permissions:
  contents: read

concurrency:
  group: wechat-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli
          python -m pip install scons
      - name: Test adaptation and packaging
        run: python tools/test.py
      - name: Read pinned Emscripten version
        id: toolchain
        run: |
          python -c 'import json,os; m=json.load(open("engine/manifest.json")); print("version="+m["emscripten_version"], file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: actions/cache@v4
        with:
          path: build/emsdk-4.7.2
          key: emsdk-${{ runner.os }}-${{ steps.toolchain.outputs.version }}
      - name: Install pinned Emscripten
        env:
          EMSCRIPTEN_VERSION: ${{ steps.toolchain.outputs.version }}
        run: |
          test -d build/emsdk-4.7.2 || git clone --depth=1 https://github.com/emscripten-core/emsdk.git build/emsdk-4.7.2
          build/emsdk-4.7.2/emsdk install "$EMSCRIPTEN_VERSION"
          build/emsdk-4.7.2/emsdk activate "$EMSCRIPTEN_VERSION"
      - name: Fetch and adapt official Godot
        run: |
          python build.py fetch
          python build.py apply
          python build.py apply
          python build.py build --enable-3d --dry-run
      - name: Build engine
        env:
          ENABLE_3D: ${{ inputs.enable_3d || false }}
        run: |
          source build/emsdk-4.7.2/emsdk_env.sh
          args=()
          if [ "$ENABLE_3D" = true ]; then args+=(--enable-3d); fi
          python build.py build --jobs 2 "${args[@]}"
      - name: Assemble template (PCK and AppID required before preview)
        run: python build.py package
      - name: Package reusable Godot plugin
        run: python tools/package_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: scene-packer-plugin
          path: dist/scene-packer-plugin.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-engine-template-${{ inputs.enable_3d && '3d' || '2d' }}
          path: dist/wxgame/
          if-no-files-found: error
